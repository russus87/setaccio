[package]
name = "setaccio"
version = "0.3.0"
description = "Indicizza, categorizza e cerca i tuoi file"
authors = ["russus"]
edition = "2021"
# 1.81: `std::panic::PanicHookInfo`, usato in `scan.rs` per zittire i panic dei
# parser di terze parti durante la scansione.
rust-version = "1.81"

[lib]
name = "setaccio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
chrono = "0.4.45"
dirs = "6.0.0"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
globset = "0.4.19"
infer = "0.22.0"
pdf-extract = "0.12.0"
quick-xml = "0.39.4"
rayon = "1.10.0"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2.5.0"
zip = "4.2.0"

[profile.release]
# NON mettere `panic = "abort"`: la scansione isola ogni file con
# `catch_unwind`, così un PDF malformato o un parser di terze parti che sbaglia
# un indice fanno saltare quel file e non l'intera passata su 17.000. Con
# `abort` quella protezione sparirebbe proprio in release, cioè dove serve.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
